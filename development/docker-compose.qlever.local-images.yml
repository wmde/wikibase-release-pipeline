# Native local images for the QLever experimental Compose application.
# Use with:
# docker compose -f docker-compose.qlever.yml \
#   -f development/docker-compose.qlever.local-images.yml up -d
#
# The image names, tags, and pull policy intentionally match the normal
# development/docker-compose.local-images.yml override selected by
# `wbs install --from-source`.
services:
  wikibase:
    image: wikibase/wikibase:latest
    pull_policy: never
  wikibase-jobrunner:
    image: wikibase/wikibase:latest
    pull_policy: never
  qlever-rdf-dump:
    image: wikibase/wikibase:latest
    pull_policy: never
  elasticsearch:
    image: wikibase/opensearch:latest
    pull_policy: never
  wdqs-frontend:
    image: wikibase/wdqs-frontend:latest
    pull_policy: never
  quickstatements:
    image: wikibase/quickstatements:latest
    pull_policy: never
