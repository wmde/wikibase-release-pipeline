services:
  wikibase:
    volumes:
      - ./pingback/LocalSettings.php:/test-settings/LocalSettings.php:ro

  pingback-beacon:
    image: "node:lts-alpine"
    user: node
    command: node beacon.mjs
    working_dir: /home/node/app
    restart: always
    volumes:
      - ./pingback/beacon.mjs:/home/node/app/beacon.mjs
    ports:
      - 7171:80
