name: wbs-dev-test-services

# Keep the production service composition while resolving relative service
# paths from the test project directory used by the integration harness.
include:
  - path: ../../compose/wikibase.yml
    project_directory: .
  - path: ../../compose/query-service.yml
    project_directory: .
  - path: ../../compose/quickstatements.yml
    project_directory: .
  - path: ../../compose/proxy.yml
    project_directory: .
  - path: ../../compose/wbs-tools.yml
    project_directory: .
    env_file: ../../.wbs/version

volumes:
  wikibase-image-data:
  mysql-data:
  wdqs-data:
  elasticsearch-data:
  quickstatements-data:
  traefik-letsencrypt-data:
  wbs-operations-data:
