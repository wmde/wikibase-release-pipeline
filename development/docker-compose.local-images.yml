# Local image selection used by wbs install --from-source.
# It is selected explicitly by lifecycle command options and is never persistent.

services:
  wikibase:
    image: wikibase/wikibase:latest
    pull_policy: never
  wikibase-jobrunner:
    image: wikibase/wikibase:latest
    pull_policy: never
  elasticsearch:
    image: wikibase/opensearch:latest
    pull_policy: never
  wdqs:
    image: wikibase/wdqs:latest
    pull_policy: never
  wdqs-updater:
    image: wikibase/wdqs:latest
    pull_policy: never
  wdqs-frontend:
    image: wikibase/wdqs-frontend:latest
    pull_policy: never
  quickstatements:
    image: wikibase/quickstatements:latest
    pull_policy: never
