# Local image selection used by wbs install --from-source.
# It is selected explicitly by lifecycle command options and is never persistent.

services:
  wikibase:
    image: wikibase/wikibase:latest
    pull_policy: never
  wikibase-jobrunner:
    image: wikibase/wikibase:latest
    pull_policy: never
  elasticsearch:
    image: wikibase/opensearch:latest
    pull_policy: never
  query:
    image: wikibase/qlever:latest
    pull_policy: never
  query-updater:
    image: wikibase/qlever-updater:latest
    pull_policy: never
  query-ui:
    image: wikibase/wdqs-frontend:latest
    pull_policy: never
  quickstatements:
    image: wikibase/quickstatements:latest
    pull_policy: never
