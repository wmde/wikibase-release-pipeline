# Local image selection used by wbs install --from-source.
# WBS copies this to the conventional docker-compose.override.yml path so the
# same selection applies to direct Docker Compose and WBS Tools operations.

services:
  wikibase:
    image: wikibase/wikibase:latest
    pull_policy: never
  wikibase-jobrunner:
    image: wikibase/wikibase:latest
    pull_policy: never
  elasticsearch:
    image: wikibase/opensearch:latest
    pull_policy: never
  wdqs:
    image: wikibase/wdqs:latest
    pull_policy: never
  wdqs-updater:
    image: wikibase/wdqs:latest
    pull_policy: never
  wdqs-frontend:
    image: wikibase/wdqs-frontend:latest
    pull_policy: never
  quickstatements:
    image: wikibase/quickstatements:latest
    pull_policy: never
  wbs-tools:
    image: wikibase/wbs-tools:latest
    pull_policy: never
  wbs-tools-controller:
    image: wikibase/wbs-tools:latest
    pull_policy: never
