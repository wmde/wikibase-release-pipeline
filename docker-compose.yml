name: wbs-dev

networks:
  default:
    name: wbs-dev
    external: true

services:
  runner:
    image: wbs-dev-runner:latest
    scale: 0
    build:
      context: .
    stop_grace_period: 1s
    ports:
      - 9229:9229
      - 4211:4211
    volumes:
      - .:/workspace:z
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    env_file:
      - test/test-runner.env
      - local.env
    environment:
      HOST_PWD: $PWD
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      WBS_TEST_IMAGE_REGISTRY: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}
      WBS_TEST_IMAGE_TAG: ${WBS_TEST_IMAGE_TAG:-latest}
