on:
  workflow_call:

jobs:
  skip_check:
    runs-on: ubuntu-24.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Check for duplicate successful runs
        id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["docs/**", "**/*.md", "**/*.txt", "*.md", "*.txt"]'
          skip_after_successful_duplicate: true
          cancel_others: true
          do_not_skip: '["schedule"]'

  lint:
    needs:
      - skip_check
    if: needs.skip_check.outputs.should_skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - run: ./nx lint
        working-directory: development

  build:
    needs:
      - skip_check
    if: needs.skip_check.outputs.should_skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}/wikibase
      BUILD_CACHE_PUSH: "true"

    strategy:
      fail-fast: false
      matrix:
        imageName:
          - wikibase
          - opensearch
          - wbs-tools
          - wdqs
          - wdqs-frontend
          - quickstatements

    steps:
      - uses: actions/checkout@v4

      - name: Check for WBS tools changes
        if: matrix.imageName == 'wbs-tools'
        id: wbs_tools_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          should_run=false
          if [[ "$GITHUB_REF" == refs/tags/wbs-tools@* ]] ||
             [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            should_run=true
          elif [[ -z "$BASE_SHA" ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            should_run=true
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              install \
              tools \
              development/images/wbs-tools \
              development/tooling/build-images.sh \
              .github/workflows/_build_and_test.yml \
              .github/workflows/build_and_publish_image_release.yml \
              .github/workflows/create_release.yml; then
              should_run=true
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
  
      - uses: ./.github/actions/setup-environment
        if: matrix.imageName != 'wbs-tools' || steps.wbs_tools_changes.outputs.should_run == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - name: Build and push ${{ matrix.imageName }}
        if: matrix.imageName != 'wbs-tools' || steps.wbs_tools_changes.outputs.should_run == 'true'
        run: ./nx build ${{ matrix.imageName }} --push
        working-directory: development

      - name: Test WBS installer bootstrap
        if: matrix.imageName == 'wbs-tools' && steps.wbs_tools_changes.outputs.should_run == 'true'
        run: ./nx test wbs-tools
        working-directory: development

      - name: Smoke test WBS tools image
        if: matrix.imageName == 'wbs-tools' && steps.wbs_tools_changes.outputs.should_run == 'true'
        env:
          WBS_TOOLS_IMAGE: ghcr.io/${{ github.repository_owner }}/wikibase/wbs-tools:dev-${{ github.run_id }}
        run: |
          set -euo pipefail

          smoke_dir="$(mktemp -d)"
          trap 'docker logs wbs-tools-smoke 2>/dev/null || true; docker rm -f wbs-tools-smoke 2>/dev/null || true; rm -r "$smoke_dir"' EXIT

          mkdir -p "$smoke_dir/certs" "$smoke_dir/wbs"
          touch "$smoke_dir/installation.log"
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -out "$smoke_dir/certs/cert.pem" \
            -keyout "$smoke_dir/certs/key.pem" \
            -subj /CN=localhost >/dev/null 2>&1

          docker run --rm --entrypoint sh "$WBS_TOOLS_IMAGE" \
            -c 'test -f dist/cli.js && test -f dist/server.js'

          docker run -d \
            --name wbs-tools-smoke \
            -p 127.0.0.1:18888:443 \
            -e LOCALHOST=true \
            -v "$smoke_dir/wbs:/app/wbs" \
            -v "$smoke_dir/certs:/app/certs" \
            -v "$smoke_dir/installation.log:/app/installation.log" \
            "$WBS_TOOLS_IMAGE"

          curl --fail --insecure --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors \
            https://127.0.0.1:18888/ >/dev/null

  test:
    needs:
      - skip_check
      - build
    if: needs.skip_check.outputs.should_skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        suite:
          - repo
          - queryservice
          - repo_client
          - quickstatements
          - pingback
          - opensearch

    steps:
      - uses: actions/checkout@v4
  
      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - name: "Pull images from GHCR"
        uses: ./.github/actions/pull-ghcr

      - name: "Run ${{ matrix.suite }} test suite"
        run: |
          if [[ "${{ matrix.suite }}" == "repo" ]]; then
            echo "Host CPUs: $(nproc)"
            free -h

            vmstat -w 10 > "$RUNNER_TEMP/repo-vmstat.log" &
            vmstat_pid=$!
            (
              while true; do
                printf '\n=== %s ===\n' "$(date --iso-8601=seconds)"
                docker stats --no-stream \
                  --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}' ||
                  true
                sleep 10
              done
            ) > "$RUNNER_TEMP/repo-docker-stats.log" &
            docker_stats_pid=$!

            show_resource_profile() {
              kill "$vmstat_pid" "$docker_stats_pid" 2>/dev/null || true
              wait "$vmstat_pid" "$docker_stats_pid" 2>/dev/null || true
              echo "::group::Repository host resource profile"
              cat "$RUNNER_TEMP/repo-vmstat.log"
              echo "::endgroup::"
              echo "::group::Repository container resource profile"
              cat "$RUNNER_TEMP/repo-docker-stats.log"
              echo "::endgroup::"
            }
            trap show_resource_profile EXIT
          fi

          ./nx test -- ${{ matrix.suite }}
        working-directory: development

      - name: Show logs
        if: failure()
        run: |
          ls -lahr development/test/suites/${{ matrix.suite }}/results development/test/suites/${{ matrix.suite }}/results/*
          tail -n +1 development/test/suites/${{ matrix.suite }}/results/*.log
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-${{ github.run_id }}-${{ matrix.suite }}-test-results
          path: development/test/suites/**/results
