name: Publish Installer

on:
  workflow_run:
    workflows:
      - "Build and Test"
    types:
      - completed
  push:
    tags:
      - 'wbs@*'
  workflow_dispatch:
    inputs:
      target:
        description: 'PR number (pr-942) or WBS tag (wbs@8.0.0) to republish.'
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: installer-${{ github.event.workflow_run.pull_requests[0].number || github.ref_name || inputs.target || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-manual-target:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate publication target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [[ ! "$TARGET" =~ ^(pr-[1-9][0-9]*|wbs@[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a target such as pr-942 or wbs@8.0.0; received $TARGET." >&2
            exit 1
          fi

  publish-pr:
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number != null
      ) || (
        github.event_name == 'workflow_dispatch' &&
        startsWith(inputs.target, 'pr-')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Deliberately use trusted publisher code, never code from the PR.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve pull request publication
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          AUTOMATIC_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            pr_number="$AUTOMATIC_PR_NUMBER"
            head_sha="$AUTOMATIC_HEAD_SHA"
          else
            pr_number="${MANUAL_TARGET#pr-}"
            pull_request="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
            head_sha="$(jq -r '.head.sha' <<< "$pull_request")"
          fi
          {
            echo "number=$pr_number"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish coordinated PR images
        env:
          ORIGIN_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-installer.sh prepare-pr

      - name: Dispatch PR installer publication
        env:
          GH_TOKEN: ${{ secrets.GH_WBS_BOT_TOKEN }}
        run: .github/scripts/publish-installer.sh dispatch-pr

      - name: Summarize PR installer
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
        run: |
          short_sha="${PR_HEAD_SHA:0:12}"
          if [[ ! -s "$RUNNER_TEMP/wikibase-suite-installer/pr-dispatch.json" ]]; then
            echo 'No PR installer was published by this run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Wikibase Suite PR installer'
            echo
            echo '```sh'
            echo "curl -fsSL https://wmde.github.io/wikibase-suite-install/pr-${PR_NUMBER}-${short_sha} | bash"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    if: >-
      (
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/wbs@')
      ) || (
        github.event_name == 'workflow_dispatch' &&
        startsWith(inputs.target, 'wbs@')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'push' && github.ref || inputs.target }}

      - name: Publish release installer
        env:
          GH_TOKEN: ${{ secrets.GH_WBS_BOT_TOKEN }}
          ORIGIN_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/publish-installer.sh publish-release
