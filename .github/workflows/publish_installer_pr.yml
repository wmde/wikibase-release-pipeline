name: Publish PR installer

on:
  workflow_run:
    workflows:
      - "🧪 Build and Test"
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: installer-pr-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Deliberately check out the trusted default branch, never the PR branch.
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish coordinated PR images
        env:
          ORIGIN_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.pull_requests[0].head.repo.full_name }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-installer.sh prepare-pr

      - name: Dispatch PR installer publication
        env:
          GH_TOKEN: ${{ secrets.GH_WBS_BOT_TOKEN }}
        run: .github/scripts/publish-installer.sh dispatch-pr

      - name: Summarize PR installer
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          short_sha="${PR_HEAD_SHA:0:12}"
          if [[ ! -s "$RUNNER_TEMP/wikibase-suite-installer/pr-dispatch.json" ]]; then
            echo 'No PR installer was published by this run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Wikibase Suite PR installer'
            echo
            echo '```sh'
            echo "curl -fsSL https://wmde.github.io/unused-repository/pr-${PR_NUMBER}-${short_sha} | bash"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
