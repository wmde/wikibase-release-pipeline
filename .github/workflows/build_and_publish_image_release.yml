name: 📦 Build and Publish a WBS Image Release to Dockerhub

on:
  push:
    tags:
      - 'opensearch@*'
      - 'quickstatements@*'
      - 'wbs-tools@*'
      - 'wdqs@*'
      - 'wdqs-frontend@*'
      - 'wikibase@*'

permissions:
  contents: write
  packages: write

jobs:
  build_and_test:
    uses: ./.github/workflows/_build_and_test.yml
    secrets: inherit

  extract_tag_and_publish:
    needs: build_and_test
    if: needs.build_and_test.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      # The Bake manifest and wbs-dev validate that this tag exactly matches the
      # selected image's stable IMAGE_VERSION before anything is published.
      - name: Read image name from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "IMAGE_NAME=${RELEASE_TAG%%@*}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - name: Build image and push to Dockerhub with release tags
        env:
          BUILD_CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}/wikibase
          BUILD_CACHE_PUSH: "true"
        run: |
          set -euo pipefail
          ./wbs-dev build "$IMAGE_NAME" --publish
        working-directory: development

      - name: Publish image documentation to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: wmdetravisbot
          password: ${{ secrets.WBS_PUBLISH_TOKEN }}
          repository: wikibase/${{ env.IMAGE_NAME }}
          readme-filepath: development/images/${{ env.IMAGE_NAME }}/README.md
